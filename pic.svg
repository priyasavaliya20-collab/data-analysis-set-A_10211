<svg width="1200" height="500" viewBox="0 0 1200 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ROSE -->
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F27BA6"/>
      <stop offset="100%" stop-color="#E85D8E"/>
    </linearGradient>

    <!-- BACKGROUND GRID -->
    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">

      <path d="M32 0H0V32"
            fill="none"
            stroke="#111111"
            stroke-opacity="0.045"/>

    </pattern>

    <!-- SHADOW -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="8"
        flood-opacity="0.18"/>

    </filter>

    <!-- GLOW -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- MAIN WHITE CANVAS -->
  <!-- ================================================= -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="498"
    rx="30"
    fill="#FFFFFF"
    stroke="#111111"
    stroke-width="2"/>

  <rect
    x="2"
    y="2"
    width="1196"
    height="496"
    rx="29"
    fill="url(#grid)"/>



  <!-- ================================================= -->
  <!-- LEFT SECTION -->
  <!-- ================================================= -->

  <!-- Top accent -->

  <rect
    x="45"
    y="39"
    width="78"
    height="5"
    rx="3"
    fill="url(#rose)">

    <animate
      attributeName="width"
      values="50;78;50"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Category -->

  <text
    x="45"
    y="78"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="700"
    letter-spacing="2.5"
    fill="#E85D8E">

    LOGISTICS / DATA ANALYTICS

  </text>


  <!-- TITLE -->

  <text
    x="45"
    y="125"
    font-family="Arial, Helvetica, sans-serif"
    font-size="40"
    font-weight="800"
    fill="#111111">

    Delivery Delay Analysis

  </text>


  <!-- TECHNOLOGIES -->

  <text
    x="45"
    y="157"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    fill="#666666">

    Excel • Power BI • SQL • Python

  </text>


  <!-- DESCRIPTION -->

  <text
    x="45"
    y="200"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    fill="#555555">

    Analyze delivery performance,

  </text>

  <text
    x="45"
    y="222"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    fill="#555555">

    identify delay patterns and improve operations.

  </text>



  <!-- ================================================= -->
  <!-- DELIVERY PERFORMANCE CARD -->
  <!-- ================================================= -->

  <g filter="url(#shadow)">

    <rect
      x="45"
      y="254"
      width="490"
      height="106"
      rx="18"
      fill="#FFFFFF"
      stroke="#111111"
      stroke-width="2"/>


    <!-- Rose accent -->

    <rect
      x="45"
      y="254"
      width="7"
      height="106"
      rx="4"
      fill="url(#rose)"/>


    <text
      x="72"
      y="282"
      font-family="Arial"
      font-size="11"
      font-weight="700"
      letter-spacing="1.5"
      fill="#777777">

      DELIVERY PERFORMANCE

    </text>


    <text
      x="72"
      y="320"
      font-family="Arial"
      font-size="21"
      font-weight="800"
      fill="#111111">

      Planned → Shipped → Delivered

    </text>


    <text
      x="72"
      y="344"
      font-family="Arial"
      font-size="14"
      fill="#666666">

      Track the journey and detect delivery delays.

    </text>


    <!-- Animated status -->

    <circle
      cx="445"
      cy="307"
      r="14"
      fill="#F27BA6">

      <animate
        attributeName="r"
        values="13;18;13"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="445"
      cy="307"
      r="27"
      fill="none"
      stroke="#F27BA6"
      stroke-width="2"
      opacity="0.25">

      <animate
        attributeName="r"
        values="22;33;22"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>

  </g>



  <!-- ================================================= -->
  <!-- PROCESS -->
  <!-- ================================================= -->

  <text
    x="45"
    y="405"
    font-family="Arial"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="#777777">

    DATA

  </text>


  <text
    x="180"
    y="405"
    font-family="Arial"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="#777777">

    CLEAN

  </text>


  <text
    x="315"
    y="405"
    font-family="Arial"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="#777777">

    ANALYZE

  </text>


  <text
    x="455"
    y="405"
    font-family="Arial"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="#777777">

    INSIGHT

  </text>


  <!-- Timeline -->

  <line
    x1="55"
    y1="430"
    x2="455"
    y2="430"
    stroke="#111111"
    stroke-width="2"/>


  <!-- DATA -->

  <circle
    cx="55"
    cy="430"
    r="8"
    fill="#FFFFFF"
    stroke="#E85D8E"
    stroke-width="3"/>


  <!-- CLEAN -->

  <circle
    cx="170"
    cy="430"
    r="10"
    fill="#E85D8E">

    <animate
      attributeName="r"
      values="9;12;9"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ANALYZE -->

  <circle
    cx="305"
    cy="430"
    r="20"
    fill="#111111"/>


  <path
    d="M296 430 L302 436 L314 422"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"/>


  <!-- INSIGHT -->

  <circle
    cx="450"
    cy="430"
    r="10"
    fill="#FFFFFF"
    stroke="#E85D8E"
    stroke-width="4">

    <animate
      attributeName="r"
      values="8;13;8"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>



  <!-- ================================================= -->
  <!-- RIGHT BLACK DELIVERY MONITOR -->
  <!-- ================================================= -->

  <g filter="url(#shadow)">

    <rect
      x="584"
      y="38"
      width="572"
      height="425"
      rx="28"
      fill="#111111"
      stroke="#E85D8E"
      stroke-width="2"/>

  </g>


  <!-- HEADER -->

  <text
    x="620"
    y="77"
    font-family="Arial"
    font-size="13"
    font-weight="700"
    letter-spacing="2"
    fill="#E85D8E">

    DELIVERY MONITOR

  </text>


  <text
    x="620"
    y="108"
    font-family="Arial"
    font-size="25"
    font-weight="800"
    fill="#FFFFFF">

    Shipment → Route → Delivery

  </text>


  <text
    x="620"
    y="133"
    font-family="Arial"
    font-size="14"
    fill="#AAAAAA">

    Animated delivery tracking

  </text>



  <!-- ================================================= -->
  <!-- DELIVERY ROUTE -->
  <!-- ================================================= -->

  <path
    id="deliveryRoute"
    d="
      M665 325
      C700 292 730 302 760 318
      C790 335 815 325 838 300
      C870 268 900 294 925 280
      C955 262 970 246 1000 235
      C1030 224 1060 214 1090 205"
    fill="none"
    stroke="#E85D8E"
    stroke-width="4"
    stroke-dasharray="10 9"/>


  <!-- Animated route dash -->

  <path
    d="
      M665 325
      C700 292 730 302 760 318
      C790 335 815 325 838 300
      C870 268 900 294 925 280
      C955 262 970 246 1000 235
      C1030 224 1060 214 1090 205"
    fill="none"
    stroke="#F27BA6"
    stroke-width="2"
    stroke-dasharray="4 12">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-80"
      dur="1.5s"
      repeatCount="indefinite"/>

  </path>



  <!-- ================================================= -->
  <!-- LOCATION POINTS -->
  <!-- ================================================= -->

  <!-- WAREHOUSE -->

  <circle
    cx="665"
    cy="325"
    r="10"
    fill="#FFFFFF"
    stroke="#F27BA6"
    stroke-width="4"/>


  <text
    x="640"
    y="354"
    font-family="Arial"
    font-size="9"
    font-weight="700"
    fill="#999999">

    WAREHOUSE

  </text>


  <!-- HUB -->

  <circle
    cx="820"
    cy="315"
    r="10"
    fill="#FFFFFF"
    stroke="#F27BA6"
    stroke-width="4"/>


  <text
    x="805"
    y="337"
    font-family="Arial"
    font-size="9"
    font-weight="700"
    fill="#999999">

    HUB

  </text>


  <!-- CITY -->

  <circle
    cx="980"
    cy="247"
    r="10"
    fill="#F27BA6"
    stroke="#FFFFFF"
    stroke-width="3"/>


  <text
    x="964"
    y="272"
    font-family="Arial"
    font-size="9"
    font-weight="700"
    fill="#999999">

    CITY

  </text>


  <!-- CUSTOMER -->

  <circle
    cx="1090"
    cy="205"
    r="13"
    fill="#FFFFFF"
    stroke="#E85D8E"
    stroke-width="4"/>


  <text
    x="1050"
    y="201"
    font-family="Arial"
    font-size="9"
    font-weight="700"
    fill="#E85D8E">

    CUSTOMER

  </text>



  <!-- ================================================= -->
  <!-- ANIMATED DELIVERY CAR -->
  <!-- ================================================= -->

  <g id="deliveryCar">

    <!-- Car shadow -->

    <ellipse
      cx="0"
      cy="23"
      rx="48"
      ry="6"
      fill="#000000"
      opacity="0.5"/>


    <!-- MAIN BODY -->

    <path
      d="
        M-52 8
        L-43 -15
        L-18 -22
        L15 -22
        L32 -10
        L52 -5
        L58 8
        L54 17
        L-50 17
        Z"
      fill="#F27BA6"/>


    <!-- ROOF -->

    <path
      d="
        M-25 -20
        L-10 -39
        L20 -39
        L38 -10
        L15 -22
        Z"
      fill="#E85D8E"/>


    <!-- BACK WINDOW -->

    <path
      d="
        M-7 -34
        L-20 -22
        L5 -22
        L3 -34
        Z"
      fill="#111111"/>


    <!-- FRONT WINDOW -->

    <path
      d="
        M7 -34
        L19 -34
        L32 -14
        L10 -20
        Z"
      fill="#111111"/>


    <!-- DELIVERY BOX -->

    <rect
      x="-39"
      y="-12"
      width="20"
      height="20"
      rx="3"
      fill="#FFFFFF"/>


    <line
      x1="-29"
      y1="-12"
      x2="-29"
      y2="8"
      stroke="#E85D8E"
      stroke-width="2"/>


    <line
      x1="-39"
      y1="-2"
      x2="-19"
      y2="-2"
      stroke="#E85D8E"
      stroke-width="2"/>


    <!-- HEADLIGHT -->

    <circle
      cx="53"
      cy="1"
      r="4"
      fill="#FFFFFF"
      filter="url(#glow)">

      <animate
        attributeName="opacity"
        values="0.3;1;0.3"
        dur="1s"
        repeatCount="indefinite"/>

    </circle>


    <!-- REAR LIGHT -->

    <rect
      x="-53"
      y="0"
      width="5"
      height="7"
      rx="2"
      fill="#E85D8E"/>


    <!-- WHEELS -->

    <circle
      cx="-32"
      cy="17"
      r="11"
      fill="#050505"/>


    <circle
      cx="37"
      cy="17"
      r="11"
      fill="#050505"/>


    <circle
      cx="-32"
      cy="17"
      r="4"
      fill="#777777"/>


    <circle
      cx="37"
      cy="17"
      r="4"
      fill="#777777"/>


    <!-- WHEEL HUB HIGHLIGHTS -->

    <circle
      cx="-32"
      cy="17"
      r="2"
      fill="#FFFFFF"/>


    <circle
      cx="37"
      cy="17"
      r="2"
      fill="#FFFFFF"/>


    <!-- ================================================= -->
    <!-- CAR FOLLOWS ROUTE -->
    <!-- ================================================= -->

    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      rotate="auto">

      <mpath href="#deliveryRoute"/>

    </animateMotion>

  </g>



  <!-- ================================================= -->
  <!-- ANIMATED LOCATION DOT -->
  <!-- ================================================= -->

  <circle
    r="4"
    fill="#FFFFFF"
    filter="url(#glow)">

    <animateMotion
      dur="3s"
      repeatCount="indefinite">

      <mpath href="#deliveryRoute"/>

    </animateMotion>

  </circle>



  <!-- ================================================= -->
  <!-- DELAY ALERT -->
  <!-- ================================================= -->

  <rect
    x="915"
    y="390"
    width="195"
    height="43"
    rx="12"
    fill="#E85D8E">

    <animate
      attributeName="opacity"
      values="0.75;1;0.75"
      dur="2s"
      repeatCount="indefinite"/>

  </rect>


  <text
    x="1012"
    y="417"
    text-anchor="middle"
    font-family="Arial"
    font-size="12"
    font-weight="800"
    fill="#FFFFFF">

    DELIVERY DELAY DETECTED

  </text>



  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <text
    x="620"
    y="440"
    font-family="Arial"
    font-size="10"
    font-weight="600"
    letter-spacing="1.5"
    fill="#777777">

    EXCEL • POWER BI • SQL • PYTHON

  </text>



  <!-- ================================================= -->
  <!-- FLOATING PARTICLES -->
  <!-- ================================================= -->

  <circle
    cx="1110"
    cy="70"
    r="3"
    fill="#F27BA6">

    <animate
      attributeName="cy"
      values="70;58;70"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="1080"
    cy="105"
    r="2"
    fill="#F27BA6">

    <animate
      attributeName="cy"
      values="105;92;105"
      dur="2.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="1130"
    cy="135"
    r="3"
    fill="#F27BA6">

    <animate
      attributeName="cy"
      values="135;120;135"
      dur="2.2s"
      repeatCount="indefinite"/>

  </circle>


</svg>
