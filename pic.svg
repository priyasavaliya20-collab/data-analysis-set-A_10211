<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <!-- ROSE THEME -->
    <linearGradient id="rose"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#F7A1BB"/>
      <stop offset="50%" stop-color="#F05A8A"/>
      <stop offset="100%" stop-color="#D94F7A"/>
    </linearGradient>

    <linearGradient id="softRose"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#F7A1BB"/>
      <stop offset="100%" stop-color="#F05A8A"/>
    </linearGradient>

    <!-- GRID -->
    <pattern id="grid"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">

      <path d="M28 0H0V28"
            fill="none"
            stroke="#E9E9E9"
            stroke-width="1"/>
    </pattern>

    <!-- SHADOW -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="7"
        flood-opacity=".15"/>
    </filter>

    <!-- GLOW -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1200"
    height="500"
    fill="#FFFFFF"/>

  <rect
    y="7"
    width="1200"
    height="493"
    fill="url(#grid)"
    opacity=".55"/>


  <!-- ================================================= -->
  <!-- TOP ROSE LINE -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="7"
    fill="url(#rose)">

    <animate
      attributeName="opacity"
      values=".75;1;.75"
      dur="2.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- LEFT HEADER -->
  <!-- ================================================= -->

  <text
    x="65"
    y="57"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="2"
    fill="#E85A88">

    TASK ONE • DATA ANALYSIS

  </text>


  <text
    x="65"
    y="105"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="800"
    fill="#111111">

    Excel

  </text>


  <text
    x="65"
    y="135"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    fill="#666666">

    Import • Clean • Lookup • Summarize

  </text>


  <!-- ================================================= -->
  <!-- WORKFLOW CARD -->
  <!-- ================================================= -->

