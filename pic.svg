<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

<defs>

  <!-- =============================== -->
  <!-- ROSE / PINK THEME -->
  <!-- =============================== -->

  <linearGradient id="rose"
                  x1="0" y1="0"
                  x2="1" y2="1">

    <stop offset="0%" stop-color="#F7A1BB"/>
    <stop offset="50%" stop-color="#F05A8A"/>
    <stop offset="100%" stop-color="#D94F7A"/>

  </linearGradient>


  <linearGradient id="softRose"
                  x1="0" y1="0"
                  x2="1" y2="0">

    <stop offset="0%" stop-color="#F7A1BB"/>
    <stop offset="100%" stop-color="#F05A8A"/>

  </linearGradient>


  <!-- GRID -->

  <pattern id="grid"
           width="28"
           height="28"
           patternUnits="userSpaceOnUse">

    <path d="M28 0H0V28"
          fill="none"
          stroke="#E9E9E9"
          stroke-width="1"/>

  </pattern>


  <!-- SHADOW -->

  <filter id="shadow"
          x="-30%"
          y="-30%"
          width="160%"
          height="160%">

    <feDropShadow
      dx="0"
      dy="6"
      stdDeviation="7"
      flood-opacity=".15"/>

  </filter>


  <!-- PINK GLOW -->

  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur
      stdDeviation="4"
      result="blur"/>

    <feMerge>

      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>

    </feMerge>

  </filter>


  <!-- RELATIONSHIP PATH -->

  <path id="relationship"
        d="M950 169
           C965 169 970 185 985 185
           C997 185 1000 169 1018 169"/>


</defs>


