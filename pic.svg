<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <!-- ROSE GRADIENT -->
    <linearGradient id="rose"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#F27BA6"/>
      <stop offset="100%" stop-color="#E85D8E"/>
    </linearGradient>

    <!-- BACKGROUND GRID -->
    <pattern id="grid"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28"
            fill="none"
            stroke="#E9E9E9"
            stroke-width="1"/>
    </pattern>

    <!-- SHADOW -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="8"
        flood-opacity=".16"/>

    </filter>

    <!-- GLOW -->
    <filter id="glow">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- JOIN PATH 1 -->
    <path
      id="joinPath1"
      d="M765 222
         C795 222 790 265 815 276
         C830 283 842 283 854 283"/>

    <!-- JOIN PATH 2 -->
    <path
      id="joinPath2"
      d="M765 352
         C795 352 800 315 815 302
         C827 292 840 289 854 289"/>

  </defs>


  <!-- ================================================= -->
  <!-- MAIN CANVAS -->
  <!-- ================================================= -->

  <rect
    x="2"
    y="2"
    width="1196"
    height="496"
    rx="28"
    fill="#FFFFFF"
    stroke="#111111"
    stroke-width="3"/>

  <rect
    x="4"
    y="4"
    width="1192"
    height="492"
    rx="26"
    fill="url(#grid)"
    opacity=".55"/>


  <!-- ================================================= -->
  <!-- LEFT SIDE -->
  <!-- ================================================= -->

  <!-- Animated accent -->
  <rect
    x="45"
    y="38"
    width="128"
    height="5"
    rx="3"
    fill="url(#rose)">

    <animate
      attributeName="width"
      values="45;128;45"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>


  <text
    x="45"
    y="78"
    font-family="Arial"
    font-size="14"
    font-weight="700"
    letter-spacing="2.5"
    fill="#E85D8E">

    TASK 2 / DATA ANALYTICS

  </text>


  <!-- MAIN TITLE -->

  <text
    x="45"
    y="127"
    font-family="Arial"
    font-size="42"
    font-weight="800"
    fill="#111111">

    SQL

  </text>


  <text
    x="45"
    y="159"
    font-family="Arial"
    font-size="17"
    fill="#666666">

    Query • Join • Group • Analyze

  </text>


  <!-- DESCRIPTION -->

  <text
    x="45"
    y="202"
    font-family="Arial"
    font-size="15"
    fill="#555555">

    <tspan x="45">
      Transform delivery data into
    </tspan>

    <tspan x="45" dy="23">
      structured analytical insights.
    </tspan>

  </text>


  <!-- ================================================= -->
  <!-- SQL WORKFLOW CARD -->
  <!-- ================================================= -->

  <g filter="url(#shadow)">

    <rect
      x="45"
      y="258"
      width="490"
      height="104"
      rx="18"
      fill="#111111"/>

    <rect
      x="45"
      y="258"
      width="7"
      height="104"
      rx="3"
      fill="url(#rose)"/>

  </g>


  <text
    x="72"
    y="286"
    font-family="Arial"
    font-size="10"
    font-weight="700"
    letter-spacing="2"
    fill="#999999">

    SQL WORKFLOW

  </text>


  <text
    x="72"
    y="315"
    font-family="Courier New"
    font-size="14"
    font-weight="700"
    fill="#FFFFFF">

    SELECT • JOIN • GROUP BY

  </text>


  <text
    x="72"
    y="343"
    font-family="Courier New"
    font-size="14"
    font-weight="700"
    fill="#FFFFFF">

    HAVING • ORDER BY • LIMIT

  </text>


  <!-- ================================================= -->
  <!-- PROCESS LINE -->
  <!-- ================================================= -->

  <text
    x="45"
    y="410"
    font-family="Arial"
    font-size="10"
    font-weight="700"
    letter-spacing="1.8"
    fill="#888888">

    TABLES

  </text>


  <line
    x1="100"
    y1="406"
    x2="239"
    y2="406"
    stroke="#111111"
    stroke-width="2"/>


  <!-- Animated first node -->

  <circle
    cx="169"
    cy="406"
    r="10"
    fill="url(#rose)"
    stroke="#FFFFFF"
    stroke-width="3">

    <animate
      attributeName="r"
      values="7;12;7"
      dur="1.8s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="258"
    y="410"
    font-family="Arial"
    font-size="10"
    font-weight="700"
    letter-spacing="1.8"
    fill="#888888">

    JOIN

  </text>


  <line
    x1="300"
    y1="406"
    x2="350"
    y2="406"
    stroke="#111111"
    stroke-width="2"/>


  <!-- Animated JOIN node -->

  <circle
    cx="359"
    cy="406"
    r="9"
    fill="#111111">

    <animate
      attributeName="fill"
      values="#111111;#E85D8E;#111111"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <line
    x1="369"
    y1="406"
    x2="434"
    y2="406"
    stroke="#111111"
    stroke-width="2"/>


  <text
    x="447"
    y="410"
    font-family="Arial"
    font-size="10"
    font-weight="700"
    letter-spacing="1.8"
    fill="#888888">

    RESULT

  </text>


  <!-- ================================================= -->
  <!-- RIGHT BLACK PANEL -->
  <!-- ================================================= -->

  <rect
    x="584"
    y="38"
    width="572"
    height="425"
    rx="28"
    fill="#111111"
    stroke="#E85D8E"
    stroke-width="2.5"
    filter="url(#shadow)"/>


  <text
    x="620"
    y="78"
    font-family="Arial"
    font-size="13"
    font-weight="700"
    letter-spacing="2.5"
    fill="#F27BA6">

    SQL ANALYSIS

  </text>


  <text
    x="620"
    y="108"
    font-family="Arial"
    font-size="26"
    font-weight="800"
    fill="#FFFFFF">

    Delivery Data Query Engine

  </text>


  <text
    x="620"
    y="131"
    font-family="Arial"
    font-size="13"
    fill="#AAAAAA">

    Relational data → analytical result

  </text>


  <!-- ================================================= -->
  <!-- DELIVERIES TABLE -->
  <!-- ================================================= -->

  <rect
    x="620"
    y="165"
    width="145"
    height="116"
    rx="14"
    fill="#FFFFFF"
    filter="url(#shadow)"/>


  <rect
    x="620"
    y="165"
    width="145"
    height="29"
    rx="14"
    fill="url(#rose)"/>

  <rect
    x="620"
    y="180"
    width="145"
    height="14"
    fill="url(#rose)"/>


  <text
    x="692"
    y="184"
    text-anchor="middle"
    font-family="Arial"
    font-size="11"
    font-weight="800"
    fill="#FFFFFF">

    DELIVERIES

  </text>


  <text
    x="635"
    y="218"
    font-family="Courier New"
    font-size="10">

    delivery_id

  </text>


  <text
    x="635"
    y="237"
    font-family="Courier New"
    font-size="10">

    route_id

  </text>


  <text
    x="635"
    y="256"
    font-family="Courier New"
    font-size="10">

    promised_days

  </text>


  <text
    x="635"
    y="275"
    font-family="Courier New"
    font-size="10">

    actual_days

  </text>


  <!-- ================================================= -->
  <!-- ROUTES TABLE -->
  <!-- ================================================= -->

  <rect
    x="620"
    y="305"
    width="145"
    height="93"
    rx="14"
    fill="#FFFFFF"
    filter="url(#shadow)"/>


  <rect
    x="620"
    y="305"
    width="145"
    height="29"
    rx="14"
    fill="#1B1B1B"/>

  <rect
    x="620"
    y="320"
    width="145"
    height="14"
    fill="#1B1B1B"/>


  <text
    x="692"
    y="324"
    text-anchor="middle"
    font-family="Arial"
    font-size="11"
    font-weight="800"
    fill="#FFFFFF">

    ROUTES

  </text>


  <text
    x="635"
    y="357"
    font-family="Courier New"
    font-size="10">

    route_id

  </text>


  <text
    x="635"
    y="376"
    font-family="Courier New"
    font-size="10">

    hub

  </text>


  <text
    x="635"
    y="395"
    font-family="Courier New"
    font-size="10">

    service_type

  </text>


  <!-- ================================================= -->
  <!-- ANIMATED JOIN LINES -->
  <!-- ================================================= -->

  <use
    href="#joinPath1"
    fill="none"
    stroke="#E85D8E"
    stroke-width="3"
    stroke-dasharray="9 7">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-32"
      dur="1s"
      repeatCount="indefinite"/>

  </use>


  <use
    href="#joinPath2"
    fill="none"
    stroke="#E85D8E"
    stroke-width="3"
    stroke-dasharray="9 7">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-32"
      dur="1s"
      repeatCount="indefinite"/>

  </use>


  <text
    x="788"
    y="270"
    font-family="Arial"
    font-size="10"
    font-weight="800"
    fill="#F27BA6">

    JOIN

  </text>


  <!-- MOVING DATA DOT 1 -->

  <circle
    r="7"
    fill="#F27BA6"
    filter="url(#glow)">

    <animateMotion
      dur="2.2s"
      repeatCount="indefinite">

      <mpath href="#joinPath1"/>

    </animateMotion>

  </circle>


  <!-- MOVING DATA DOT 2 -->

  <circle
    r="6"
    fill="#FFFFFF">

    <animateMotion
      dur="2.2s"
      begin="1.1s"
      repeatCount="indefinite">

      <mpath href="#joinPath2"/>

    </animateMotion>

  </circle>


  <!-- ================================================= -->
  <!-- DATABASE -->
  <!-- ================================================= -->

  <g transform="translate(850 176)">

    <ellipse
      cx="70"
      cy="17"
      rx="70"
      ry="17"
      fill="#FFFFFF"
      stroke="#E85D8E"
      stroke-width="2.5"/>


    <path
      d="M0 17V110
         C0 128 140 128 140 110
         V17"
      fill="#171717"
      stroke="#E85D8E"
      stroke-width="2.5"/>


    <ellipse
      cx="70"
      cy="55"
      rx="70"
      ry="17"
      fill="none"
      stroke="#E85D8E"
      stroke-width="2"/>


    <ellipse
      cx="70"
      cy="91"
      rx="70"
      ry="17"
      fill="none"
      stroke="#666666"
      stroke-width="1.5"/>


    <!-- Database pulse -->

    <circle
      cx="70"
      cy="50"
      r="8"
      fill="#F27BA6"
      filter="url(#glow)">

      <animate
        attributeName="r"
        values="5;10;5"
        dur="1.4s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="70"
      cy="109"
      r="5"
      fill="#FFFFFF">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- QUERY RESULT -->
  <!-- ================================================= -->

  <rect
    x="875"
    y="344"
    width="225"
    height="54"
    rx="15"
    fill="url(#rose)"
    filter="url(#shadow)">

    <animate
      attributeName="opacity"
      values=".82;1;.82"
      dur="2s"
      repeatCount="indefinite"/>

  </rect>


  <text
    x="987"
    y="366"
    text-anchor="middle"
    font-family="Arial"
    font-size="10"
    font-weight="800"
    fill="#FFFFFF">

    QUERY RESULT

  </text>


  <text
    x="987"
    y="385"
    text-anchor="middle"
    font-family="Arial"
    font-size="11"
    font-weight="700"
    fill="#FFFFFF">

    DELAY • ROUTE • HUB

  </text>


  <!-- ================================================= -->
  <!-- FLOATING ANIMATION -->
  <!-- ================================================= -->

  <circle
    cx="1115"
    cy="78"
    r="3"
    fill="#F27BA6">

    <animate
      attributeName="r"
      values="2;6;2"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="1087"
    cy="113"
    r="2"
    fill="#E85D8E">

    <animate
      attributeName="cy"
      values="113;105;113"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- FOOTER -->

  <text
    x="620"
    y="439"
    font-family="Arial"
    font-size="9.5"
    font-weight="700"
    letter-spacing="1.5"
    fill="#777777">

    SQL • TABLES • JOIN • GROUP BY • HAVING • ORDER BY

  </text>

</svg>
