<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <!-- ============================================= -->
    <!-- PINK / ROSE GRADIENT -->
    <!-- ============================================= -->

    <linearGradient id="pink"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#F47BA2"/>
      <stop offset="100%" stop-color="#D94F7A"/>

    </linearGradient>


    <!-- ============================================= -->
    <!-- LIGHT PINK GRADIENT -->
    <!-- ============================================= -->

    <linearGradient id="lightPink"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%" stop-color="#F7A1BB"/>
      <stop offset="100%" stop-color="#F05A8A"/>

    </linearGradient>


    <!-- ============================================= -->
    <!-- BACKGROUND GRID -->
    <!-- ============================================= -->

    <pattern id="grid"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">

      <path d="M28 0H0V28"
            fill="none"
            stroke="#E9E9E9"
            stroke-width="1"/>

    </pattern>


    <!-- ============================================= -->
    <!-- SHADOW -->
    <!-- ============================================= -->

    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="8"
        flood-opacity="0.16"/>

    </filter>


    <!-- ============================================= -->
    <!-- PINK GLOW -->
    <!-- ============================================= -->

    <filter id="pinkGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ============================================= -->
    <!-- DATA FLOW PATH -->
    <!-- ============================================= -->

    <path id="dataFlow"
          d="
          M670 285
          C720 250
          780 230
          835 205
          C885 182
          930 160
          980 153
          "/>

  </defs>


  <!-- ================================================= -->
  <!-- MAIN BACKGROUND -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="500"
    fill="#FFFFFF"/>


  <rect
    x="0"
    y="7"
    width="1200"
    height="493"
    fill="url(#grid)"
    opacity="0.55"/>


  <!-- ================================================= -->
  <!-- TOP PINK LINE -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="7"
    fill="url(#pink)">

    <animate
      attributeName="opacity"
      values="0.75;1;0.75"
      dur="2.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- LEFT HEADER -->
  <!-- ================================================= -->

  <text
    x="65"
    y="57"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="2.2"
    fill="#E85A88">

    TASK THREE • DATA ANALYSIS

  </text>


  <text
    x="65"
    y="108"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="800"
